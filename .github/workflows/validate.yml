name: Validate skills

# No path filter: the repo is small, and filtering previously let changes to
# scripts/ and README.md reach main with no CI run at all.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml

      # Catalog/manifest wiring plus Agent Skills spec conformance of every SKILL.md.
      # This is the blocking gate.
      - name: Validate marketplace, plugins, and skills
        run: python scripts/validate_skills.py

      # The installer is documented for Linux/macOS users, so it must at least parse
      # and be executable on a fresh clone.
      - name: Check shell script syntax and mode
        run: |
          bash -n scripts/install-skills.sh
          test -x scripts/install-skills.sh || {
            echo "::error file=scripts/install-skills.sh::not executable in git (git update-index --chmod=+x)"
            exit 1
          }

      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install-skills.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "install-skills.ps1 parses cleanly"

      # Second opinion from the official validator. Non-blocking because it pulls
      # Claude Code from npm and can fail for reasons unrelated to this repo, but
      # every plugin is still checked even if an earlier one fails.
      - name: Validate with Claude Code CLI
        continue-on-error: true
        run: |
          rc=0
          npx -y @anthropic-ai/claude-code@latest plugin validate . || rc=1
          for dir in plugins/*/; do
            npx -y @anthropic-ai/claude-code@latest plugin validate "$dir" || rc=1
          done
          exit $rc
